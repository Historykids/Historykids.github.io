name: Verify public Sengoku runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-alliance-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify public protection rules and alliance ranking
        run: |
          node --input-type=module <<'JS'
          const base='https://historykids-ranking-api.historykids-5185046038.workers.dev';
          let ready=false;for(let attempt=0;attempt<96;attempt++){const r=await fetch(base+'/wealth/sengoku/worlds',{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});const d=await r.json();ready=r.ok&&d.protocol==='sengoku-world-v6'&&d.attackCooldownMs===300000&&d.captureCooldownMs===300000&&d.worldCount===5&&d.initialOwnedGarrison===2000&&d.reclaimProtectionMs===7200000&&d.reclaimIgnoresProtection===false&&d.clientRules===7&&d.modernMapVersion==='modern-borders-20261029-v1'&&d.mapVersion==='world-modern-v1'&&d.territoryCount===311&&d.overseasTerritoryCount===241&&d.mapExpansionVersion==='global-map-neutral-20261028'&&d.defenseResetVersion==='three-worlds-defense-zero-20261025'&&d.allianceFeatures==='command-center-v2'&&d.damageDivisor===10&&d.wrongAnswerCooldownMs===300000&&d.worldSwitch==='preserve-world-progress'&&d.territoryResetVersion==='quarter-force-neutral-half-20261025';if(ready)break;if(attempt<95)await new Promise(resolve=>setTimeout(resolve,5000));}if(!ready)throw Error('Updated Sengoku configuration did not become ready');
          for(const path of ['/wealth/sengoku/worlds','/wealth/sengoku/world/alliances']){
            const r=await fetch(base+path,{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
            const d=await r.json();
            if(!r.ok)throw Error(path+' returned '+r.status);
            if(path.endsWith('/worlds')){
              console.log(JSON.stringify({protectionMs:d.protectionMs,reclaimProtectionMs:d.reclaimProtectionMs,reclaimIgnoresProtection:d.reclaimIgnoresProtection,captureCooldownMs:d.captureCooldownMs}));
              if(d.initialOwnedGarrison!==2000||d.protectionMs!==7200000||d.startingProtectionMs!==7200000||d.respawnProtectionMs!==7200000||d.reclaimProtectionMs!==7200000||d.reclaimIgnoresProtection!==false||d.captureCooldownMs!==300000)throw Error('Province protection configuration mismatch');
              if(d.protocol!=='sengoku-world-v6'||d.alliances?.protocol!=='sengoku-alliance-v1'||d.alliances.maxMembers!==5||d.alliances.bonusPerAlly!==2||d.alliances.maxSoldierBonus!==8)throw Error('Alliance configuration mismatch');
            }else if(d.protocol!=='sengoku-alliance-v1'||d.maxMembers!==5||!Array.isArray(d.entries)||d.entries.some(a=>'owner' in a||'allianceInvites' in a||!Number.isSafeInteger(a.force)))throw Error('Alliance ranking mismatch');
            console.log(path+' passed');
          }
          console.log('Public protection and alliance checks passed; no alliance, invitation or player created');
          JS

