name: Deploy historical AI API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-figure-api.yml'
      - 'server/figure-api/**'
      - 'assets/ui/figure-data.js'
permissions:
  contents: write
  pages: write
concurrency:
  group: historykids-figure-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Ensure a workers.dev address is available
        env:
          CF_DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {ensureSubdomain} from './server/figure-api/ensure-subdomain.mjs';
          const status = await ensureSubdomain({account:process.env.CF_DEPLOY_ACCOUNT,token:process.env.CF_DEPLOY_TOKEN,repository:process.env.GITHUB_REPOSITORY});
          console.log('workers.dev address: ' + status);
          JS
      - name: Deploy Workers AI server
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/figure-api
          wranglerVersion: '4.147.0'
          command: deploy
      - name: Verify and connect the public site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base = new URL(process.env.DEPLOYMENT_URL);
          if (base.protocol !== 'https:' || !base.hostname.endsWith('.workers.dev')) throw Error('Unexpected deployment URL');
          let ready = false;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const result = await fetch(new URL('/health', base), {signal: AbortSignal.timeout(15000)});
              ready = result.ok && (await result.json()).ready === true;
            } catch {}
            if (ready) break;
            console.log('Waiting for the public HTTPS endpoint: attempt ' + attempt);
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw Error('API is not ready after waiting for HTTPS provisioning');
          const chat = await fetch(new URL('/chat', base), {method:'POST', headers:{'Content-Type':'application/json', Origin:'https://historykids.github.io'}, body:JSON.stringify({person:'nobunaga',messages:[{role:'user',content:'楽市楽座を一文で教えて'}]}), signal:AbortSignal.timeout(60000)});
          const reply = await chat.json();
          if (!chat.ok || typeof reply.answer !== 'string' || !reply.answer.trim()) throw Error('AI response check failed: HTTP ' + chat.status);
          console.log('AI response check passed');
          fs.writeFileSync('assets/ui/ai-config.js', '// Public API URL only. Never place an API key here.\nwindow.HKAIConfig = Object.freeze(' + JSON.stringify({endpoint:new URL('/chat',base).href}) + ');\n');
          const html = fs.readFileSync('figures.html', 'utf8').replace(/src="\.\/assets\/ui\/ai-config\.js[^"]*"/, 'src="./assets/ui/ai-config.js?v=' + Date.now() + '"');
          fs.writeFileSync('figures.html', html);
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/ai-config.js figures.html
          if ! git diff --cached --quiet; then
            git commit -m 'Connect the deployed historical AI API'
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages with the API connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
