name: Deploy ranking API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ranking-api.yml', 'server/ranking-api/**', 'server/figure-api/ranking*.mjs', 'assets/ui/core.js', 'assets/ui/amounts.js', 'assets/ui/wealth-rules.js', 'assets/ui/account-data.js', 'assets/ui/sengoku-rules.js', 'assets/ui/sengoku-world-rules.js', 'assets/ui/sengoku-kuni-map.js', 'assets/ui/sengoku-ranking-rules.js', 'assets/ui/sengoku-chat-rules.js']
permissions:
  contents: write
  pages: write
concurrency:
  group: historykids-ranking-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          # October 2026 security release: never fall back to an older cached 24.x.
          node-version: '>=24.22.1 <25'
          check-latest: true
      - name: Install test dependencies
        run: npm ci
      - name: Check answers, ownership, retry and durable storage
        run: |
          node scripts/sengoku-questions.cjs
          node tests/sengoku-worlds.cjs
          node tests/sengoku-worlds-ui.cjs
          node tests/sengoku-strategy.cjs
          node tests/sengoku-chat.cjs
          node tests/sengoku-strategy-ui.cjs
          node tests/sengoku-command.cjs
          node tests/sengoku-balance.cjs
          node tests/sengoku-balance-ui.cjs
          node tests/sengoku-global.cjs && node tests/sengoku-modern.cjs && node tests/sengoku-antarctica.cjs && node tests/sengoku-travel.cjs
          node tests/sengoku-global-ui.cjs
          node tests/sengoku-alliances.cjs
          node tests/sengoku-alliances-ui.cjs
          node tests/sengoku-api.cjs
          node tests/sengoku-ui.cjs
          node tests/notices-api.cjs
          node tests/notices-ui.cjs
          node tests/accounts-api.cjs
          node tests/accounts-ui.cjs
          node tests/holdem.cjs
          node tests/holdem-ui.cjs
          node tests/admin.cjs
          node tests/community-api.cjs
          node tests/expansion-api.cjs
          node tests/ranking-api.cjs
          node tests/wealth-api.cjs
      - name: Deploy ranking storage
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/ranking-api
          wranglerVersion: '4.147.0'
          command: deploy
      - name: Verify the board and connect the public site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base = new URL(process.env.DEPLOYMENT_URL);
          if (base.protocol !== 'https:' || !base.hostname.endsWith('.workers.dev')) throw Error('Unexpected deployment URL');
          const probeToken=Array.from(crypto.getRandomValues(new Uint8Array(32)),n=>n.toString(16).padStart(2,'0')).join('');
          let ready=false;
          for(let attempt=1;attempt<=12;attempt++) {
            try {const response=await fetch(new URL('/ranking',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});const data=await response.json();ready=response.ok&&Array.isArray(data.entries);if(ready){const wealth=await fetch(new URL('/wealth',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});const board=await wealth.json();ready=wealth.ok&&Array.isArray(board.entries)&&board.entries.every(entry=>Number.isSafeInteger(entry.rebirths));}}catch{}
            if(ready){
              try{
                const notices=await fetch(new URL('/wealth/notices',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
                const published=await notices.json();
                const room=await fetch(new URL('/wealth/poker',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
                const table=await room.json();
                ready=notices.ok&&Array.isArray(published.notices)&&published.notices.every(n=>n.audience==='all'&&!('recipient' in n))&&room.ok&&table.protocols?.includes('holdem-v1')&&table.room==='royal-one'&&Array.isArray(table.rooms)&&table.rooms.every(r=>!('hand' in r)&&!('owner' in r))&&Array.isArray(table.players)&&!('deck' in table)&&table.players.every(player=>!('owner' in player));
              }catch{ready=false;}
            }
            if(ready)break;
            console.log('Waiting for ranking HTTPS endpoint: attempt '+attempt);
            if(attempt<12)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!ready)throw Error('Ranking storage did not become available');
          // A rejected claim verifies the deployed authentication runtime without assigning an owner.
          const probe=await fetch(new URL('/wealth/admin/claim',base),{method:'POST',headers:{Origin:'https://historykids.github.io','Content-Type':'application/json',Authorization:'Bearer '+probeToken},body:JSON.stringify({code:'00000000'}),signal:AbortSignal.timeout(15000)});
          const denied=await probe.json();
          if(probe.status!==403||!['admin-code-invalid','admin-claimed'].includes(denied.error))throw Error('Administrator authentication runtime check failed: '+JSON.stringify({status:probe.status,error:denied.error}));
          console.log('Administrator authentication check passed; no owner assigned by the check');
          const recipients=await fetch(new URL('/wealth/admin/recipients',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
          if(recipients.status!==403||(await recipients.json()).error!=='admin-required')throw Error('Recipient directory must remain administrator-only');
          console.log('Private recipient directory access check passed');
          const privatePost=await fetch(new URL('/wealth/admin/personal-notices',base),{method:'POST',headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken,'Content-Type':'application/json'},body:JSON.stringify({requestId:crypto.randomUUID(),recipient:'0'.repeat(64),title:'',body:''}),signal:AbortSignal.timeout(15000)});
          if(privatePost.status!==403||(await privatePost.json()).error!=='admin-required')throw Error('Personal delivery must remain administrator-only');
          console.log('Personal delivery access check passed; no notice sent');
          for(const route of ['notice-history','notice-edit','notice-delete']){
            const read=route==='notice-history';
            const response=await fetch(new URL('/wealth/admin/'+route,base),{method:read?'GET':'POST',headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken,...(read?{}:{'Content-Type':'application/json'})},...(read?{}:{body:JSON.stringify({requestId:crypto.randomUUID(),id:0,expectedRevision:0})}),signal:AbortSignal.timeout(15000)});
            if(response.status!==403||(await response.json()).error!=='admin-required')throw Error('Sent-notice management must remain administrator-only: '+route);
          }
          console.log('Sent-notice management access checks passed; no notice changed');
          const campaign=await fetch(new URL('/wealth/sengoku',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
          const campaignState=await campaign.json();
          if(!campaign.ok||campaignState.protocol!=='sengoku-v1'||campaignState.state!==null)throw Error('Sengoku campaign read check failed');
          const conquest=await fetch(new URL('/wealth/sengoku/board',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const conquestBoard=await conquest.json();
          if(!conquest.ok||!Array.isArray(conquestBoard.entries)||conquestBoard.entries.some(r=>'pending' in r||'resources' in r||'learnedCards' in r))throw Error('Sengoku public ranking privacy check failed');
          console.log('Sengoku campaign and public ranking checks passed; no campaign created');
          const shared=await fetch(new URL('/wealth/sengoku/world',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
          const sharedState=await shared.json();
          let worlds,worldsResponse;
          for(let attempt=0;attempt<72;attempt++){
            worldsResponse=await fetch(new URL('/wealth/sengoku/worlds',base),{headers:{Origin:'https://historykids.github.io','Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
            worlds=await worldsResponse.json();
            if(worldsResponse.ok&&worlds.protocol==='sengoku-world-v6'&&worlds.combat==='five-correct-tenth-force'&&worlds.alliances?.protocol==='sengoku-alliance-v1'&&worlds.captureCooldownMs===300000&&worlds.attackCooldownMs===300000&&worlds.startingProvince==='zero-garrison-unprotected'&&worlds.respawnProvince==='zero-garrison-unprotected'&&worlds.clientRules===7&&worlds.modernMapVersion==='modern-borders-20261029-v1'&&worlds.titlesVersion==='unification-antarctica-v2'&&worlds.antarcticaInitialGarrison===50000&&worlds.antarcticaVersion==='antarctica-50000-20261029-v1'&&worlds.defenseSoldiersPerCorrect===50&&worlds.attackSoldiersPerCorrect===20&&worlds.titleCatalog?.some(t=>t.id==='antarctica'&&t.name==='南極の覇者')&&worlds.startingRegionScope==='worldwide'&&worlds.respawnRegionScope==='worldwide'&&worlds.initialOwnedGarrison===2000&&worlds.protectionMs===7200000&&worlds.reclaimProtectionMs===7200000&&worlds.reclaimIgnoresProtection===false&&worlds.armyModel==='split-attack-defense-v2'&&worlds.mapVersion==='world-modern-v1'&&worlds.mapExpansionVersion==='global-map-neutral-20261028'&&worlds.worldCreation==='fixed-five'&&worlds.worldCount===5&&worlds.guestEntry==='name-first-v1'&&worlds.defenseResetVersion==='three-worlds-defense-zero-20261025'&&worlds.allianceFeatures==='command-center-v2'&&worlds.damageDivisor===10&&worlds.wrongAnswerCooldownMs===300000&&worlds.worldSwitch==='preserve-world-progress'&&worlds.territoryResetVersion==='quarter-force-neutral-half-20261025'&&worlds.overseasInitialGarrison===5000&&worlds.overseasGarrisonVersion==='overseas-neutral-5000-20261029-v1')break;
            if(attempt<71)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!worldsResponse.ok||worlds.protocol!=='sengoku-world-v6'||worlds.capacity!==null||!Array.isArray(worlds.worlds)||worlds.worldCount!==5||worlds.worlds.length!==5||worlds.territoryCount!==311||worlds.worlds.some(w=>w.capacity!==null))throw Error('Shared Sengoku world runtime check failed');
          if(worlds.guestEntry!=='name-first-v1'||worlds.worldsVersion!=='five-worlds-name-first-20261030-v1'||worlds.worldCreation!=='fixed-five'||worlds.quiz?.eras?.length!==14||worlds.quiz.eras[0]!=='jomon'||worlds.quiz.eras.at(-1)!=='heisei'||worlds.quiz.questions!==298)throw Error('Jomon–Heisei quiz and fixed-five world rules runtime check failed');
          if(JSON.stringify(worlds.quizModes)!==JSON.stringify(['general','soldiers','level','battle'])||worlds.combat!=='five-correct-tenth-force'||worlds.captureCooldownMs!==300000)throw Error('Four quiz modes and capture cooldown runtime check failed');
          if(!shared.ok||sharedState.own!==null)throw Error('Shared Sengoku private view check failed');
          if(worlds.damageDivisor!==10||worlds.wrongAnswerCooldownMs!==300000||worlds.worldSwitch!=='preserve-world-progress'||worlds.territoryResetVersion!=='quarter-force-neutral-half-20261025')throw Error('Combat balance and world-switch configuration mismatch');
          if(worlds.startingProvince!=='zero-garrison-unprotected'||worlds.respawnProvince!=='zero-garrison-unprotected'||worlds.startingRegionScope!=='worldwide'||worlds.respawnRegionScope!=='worldwide')throw Error('Home selection and neutral respawn runtime check failed');
          if(worlds.initialOwnedGarrison!==2000||worlds.protectionMs!==7200000||worlds.startingProtectionMs!==7200000||worlds.respawnProtectionMs!==7200000||worlds.reclaimProtectionMs!==7200000||worlds.reclaimIgnoresProtection!==false)throw Error('Two-hour starting, recovery and reclamation protection check failed');
          if(worlds.armyModel!=='split-attack-defense-v2'||worlds.garrisonReinforcement!=='selected-land-quiz')throw Error('Independent province garrison check failed');
          if(worlds.defenseResetVersion!=='three-worlds-defense-zero-20261025'||worlds.allianceFeatures!=='command-center-v2'||worlds.attackCooldownMs!==300000||worlds.reclaimCooldownMs!==300000||worlds.mapVersion!=='world-modern-v1')throw Error('Old-country reclamation configuration mismatch');
          if(worlds.overseasInitialGarrison!==5000||worlds.overseasGarrisonVersion!=='overseas-neutral-5000-20261029-v1')throw Error('Neutral overseas garrison configuration mismatch');
          if(worlds.antarcticaInitialGarrison!==50000||worlds.antarcticaVersion!=='antarctica-50000-20261029-v1'||worlds.defenseSoldiersPerCorrect!==50||worlds.attackSoldiersPerCorrect!==20||!worlds.titleCatalog?.some(t=>t.id==='antarctica'&&t.name==='南極の覇者'))throw Error('Antarctica and defense recruitment configuration mismatch');
          const mapResponse=await fetch(new URL('/wealth/sengoku/world?world=1',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const map=await mapResponse.json();
          if(!mapResponse.ok||map.protocol!=='sengoku-world-v6'||map.own!==null||map.world?.regions?.length!==311||!map.world.regions.some(r=>r.id==='owari')||map.world.legacyPrefectureMap||map.world.players.some(p=>'owner' in p||'state' in p))throw Error('World public map check failed');
          await import('./assets/ui/sengoku-kuni-map.js');
          if(worlds.worlds.some(w=>[...w.startingRegions,...w.available].some(id=>!globalThis.HKSengokuKuniMap.region(id))))throw Error('Starting homes and respawn choices must be valid world regions');
          for(const id of [1,2,3,4,5]){
            const response=await fetch(new URL('/wealth/sengoku/world?world='+id,base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
            const view=await response.json();
            if(!response.ok||!Array.isArray(view.world?.regions)||view.world.regions.filter(r=>!r.owner&&globalThis.HKSengokuKuniMap.region(r.id)?.overseas).some(r=>!Number.isSafeInteger(r.garrison)||r.garrison<0||r.garrison>(globalThis.HKSengokuKuniMap.region(r.id)?.continent==='antarctica'?50000:5000)))throw Error('Neutral overseas garrison read check failed');
          }
          console.log('Neutral overseas garrison configuration checked in all five worlds; no army or ownership changed by the check');
          console.log('Seventy old-country regions, five unlimited worlds and selected-land defense recruitment checks passed; no player or battle created');
          console.log('One-hour province protection and land reclamation checks passed; no battle created');
          console.log('Four separate quiz modes, tenth-force combat and five-minute attack cooldown checks passed; no player, battle or quiz created');
          const alliesResponse=await fetch(new URL('/wealth/sengoku/world/alliances',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const allies=await alliesResponse.json();
          if(!alliesResponse.ok||allies.protocol!=='sengoku-alliance-v1'||allies.maxMembers!==5||!Array.isArray(allies.entries)||allies.entries.some(a=>'owner' in a||'allianceInvites' in a||!Number.isSafeInteger(a.force)))throw Error('Alliance ranking runtime check failed');
          if(worlds.alliances?.maxMembers!==5||worlds.alliances.bonusPerAlly!==2||worlds.alliances.maxSoldierBonus!==8)throw Error('Alliance benefits runtime check failed');
          console.log('Alliance consent, benefit configuration and separate ranking checks passed; no alliance or invitation created');
          const forceResponse=await fetch(new URL('/wealth/sengoku/world/ranking',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const force=await forceResponse.json();
          if(!forceResponse.ok||force.protocol!=='sengoku-force-v2'||force.scoring!=='balanced-modern-v2'||!Array.isArray(force.entries)||force.entries.some(r=>!Number.isSafeInteger(r.score)||r.score<0||r.score>10000||!r.breakdown||!Number.isSafeInteger(r.force)||!Number.isSafeInteger(r.soldiers)||'owner' in r||'pending' in r))throw Error('Sengoku force ranking runtime check failed');
          const regionalResponse=await fetch(new URL('/wealth/sengoku/world/ranking?world=1&region=europe',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const regional=await regionalResponse.json();
          if(!regionalResponse.ok||regional.protocol!=='sengoku-force-v2'||regional.region!=='europe'||regional.territoryCount!==50||regional.entries.some(r=>r.territories<1))throw Error('Regional force ranking runtime check failed');
          await import('./assets/ui/sengoku-chat-rules.js');
          const chatResponse=await fetch(new URL('/wealth/sengoku/chat',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const chat=await chatResponse.json();
          if(!chatResponse.ok||chat.protocol!=='sengoku-emoji-chat-v1'||chat.canSend!==false||!Array.isArray(chat.messages)||chat.messages.some(m=>!globalThis.HKSengokuChatRules.valid(m.emojis)||'owner' in m||'requestId' in m))throw Error('Emoji-only chat read check failed');
          console.log('Composite and regional rankings and emoji-only chat read checks passed; no player, quiz or chat message created');
          fs.writeFileSync('assets/ui/ranking-config.js','// Public URL only. Never place credentials here.\nwindow.HKRankingConfig=Object.freeze('+JSON.stringify({endpoint:new URL('/ranking',base).href})+');\n');
          const capabilitiesResponse=await fetch(new URL('/wealth/account/capabilities',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
          const capabilities=await capabilitiesResponse.json();if(!capabilitiesResponse.ok||capabilities.rename!==true)throw Error('Account rename capability check failed');
          const accountLogin=await fetch(new URL('/wealth/account/login',base),{method:'POST',headers:{Origin:'https://historykids.github.io','Content-Type':'application/json'},body:JSON.stringify({username:'runtime_probe_'+crypto.randomUUID().replaceAll('-','').slice(0,8),password:'runtime-probe-not-a-real-password'}),signal:AbortSignal.timeout(15000)});
          const loginDenied=await accountLogin.json();
          if(accountLogin.status!==401||loginDenied.error!=='account-credentials')throw Error('Account password runtime check failed: '+JSON.stringify({status:accountLogin.status,error:loginDenied.error}));
          console.log('Account authentication runtime check passed; no account created');
          console.log('Ranking storage check passed');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/ranking-config.js
          if ! git diff --cached --quiet; then
            git commit -m 'Connect the deployed ranking API'
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages with the ranking connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
