name: Deploy ranking API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ranking-api.yml', 'server/ranking-api/**', 'server/figure-api/ranking*.mjs', 'assets/ui/core.js', 'assets/ui/amounts.js', 'assets/ui/wealth-rules.js']
permissions:
  contents: write
  pages: write
concurrency:
  group: historykids-ranking-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci
      - name: Check answers, ownership, retry and durable storage
        run: |
          node tests/admin.cjs
          node tests/community-api.cjs
          node tests/expansion-api.cjs
          node tests/ranking-api.cjs
          node tests/wealth-api.cjs
      - name: Deploy ranking storage
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/ranking-api
          wranglerVersion: '4.147.0'
          command: deploy
      - name: Verify the board and connect the public site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base = new URL(process.env.DEPLOYMENT_URL);
          if (base.protocol !== 'https:' || !base.hostname.endsWith('.workers.dev')) throw Error('Unexpected deployment URL');
          const probeToken=Array.from(crypto.getRandomValues(new Uint8Array(32)),n=>n.toString(16).padStart(2,'0')).join('');
          let ready=false;
          for(let attempt=1;attempt<=12;attempt++) {
            try {const response=await fetch(new URL('/ranking',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});const data=await response.json();ready=response.ok&&Array.isArray(data.entries);if(ready){const wealth=await fetch(new URL('/wealth',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});const board=await wealth.json();ready=wealth.ok&&Array.isArray(board.entries)&&board.entries.every(entry=>Number.isSafeInteger(entry.rebirths));}}catch{}
            if(ready){
              try{
                const notices=await fetch(new URL('/wealth/notices',base),{headers:{Origin:'https://historykids.github.io'},signal:AbortSignal.timeout(15000)});
                const published=await notices.json();
                const room=await fetch(new URL('/wealth/poker',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
                const table=await room.json();
                ready=notices.ok&&Array.isArray(published.notices)&&published.notices.every(n=>n.audience==='all'&&!('recipient' in n))&&room.ok&&table.room==='royal-one'&&Array.isArray(table.rooms)&&table.rooms.every(r=>!('hand' in r)&&!('owner' in r))&&Array.isArray(table.players)&&!('deck' in table)&&table.players.every(player=>!('owner' in player));
              }catch{ready=false;}
            }
            if(ready)break;
            console.log('Waiting for ranking HTTPS endpoint: attempt '+attempt);
            if(attempt<12)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!ready)throw Error('Ranking storage did not become available');
          // A rejected claim verifies the deployed authentication runtime without assigning an owner.
          const probe=await fetch(new URL('/wealth/admin/claim',base),{method:'POST',headers:{Origin:'https://historykids.github.io','Content-Type':'application/json',Authorization:'Bearer '+probeToken},body:JSON.stringify({code:'00000000'}),signal:AbortSignal.timeout(15000)});
          const denied=await probe.json();
          if(probe.status!==403||!['admin-code-invalid','admin-claimed'].includes(denied.error))throw Error('Administrator authentication runtime check failed: '+JSON.stringify({status:probe.status,error:denied.error}));
          console.log('Administrator authentication check passed; no owner assigned by the check');
          const recipients=await fetch(new URL('/wealth/admin/recipients',base),{headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken},signal:AbortSignal.timeout(15000)});
          if(recipients.status!==403||(await recipients.json()).error!=='admin-required')throw Error('Recipient directory must remain administrator-only');
          console.log('Private recipient directory access check passed');
          const privatePost=await fetch(new URL('/wealth/admin/personal-notices',base),{method:'POST',headers:{Origin:'https://historykids.github.io',Authorization:'Bearer '+probeToken,'Content-Type':'application/json'},body:JSON.stringify({requestId:crypto.randomUUID(),recipient:'0'.repeat(64),title:'',body:''}),signal:AbortSignal.timeout(15000)});
          if(privatePost.status!==403||(await privatePost.json()).error!=='admin-required')throw Error('Personal delivery must remain administrator-only');
          console.log('Personal delivery access check passed; no notice sent');
          fs.writeFileSync('assets/ui/ranking-config.js','// Public URL only. Never place credentials here.\nwindow.HKRankingConfig=Object.freeze('+JSON.stringify({endpoint:new URL('/ranking',base).href})+');\n');
          console.log('Ranking storage check passed');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/ranking-config.js
          if ! git diff --cached --quiet; then
            git commit -m 'Connect the deployed ranking API'
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages with the ranking connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
