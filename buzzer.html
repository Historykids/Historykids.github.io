<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>歴史キッズ｜早押しチャレンジ</title>
  <style>
    :root{--ink:#1f2937;--mut:#64748b;--bg:#fff7ec;--card:#fff;--brand:#f59e0b}
    body{margin:0;background:linear-gradient(180deg,#fffdf4,#fff7ec);color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
    .wrap{max-width:920px;margin:24px auto;padding:0 14px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    header h1{font-size:18px;margin:0}
    .card{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:16px;box-shadow:0 10px 24px rgba(15,23,42,.08)}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    select,button,input{
      appearance:none;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:10px 12px;font-weight:700
    }
    button{cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08)}
    button.primary{background:linear-gradient(130deg,#fde68a,#fbbf24);border-color:#f59e0b;color:#4a3200}
    .mut{color:var(--mut);font-size:12px}
    .quiz{display:grid;gap:10px;margin-top:12px}
    .qname{font-weight:800}
    .big{font-size:20px}
    .ok{color:#14532d;background:#dcfce7;padding:6px 10px;border-radius:10px;display:inline-block}
    .ng{color:#991b1b;background:#fee2e2;padding:6px 10px;border-radius:10px;display:inline-block}
    .hidden{display:none !important}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;background:#fff}
    .warn{color:#b45309}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>早押しチャレンジ</h1>
    <a class="pill" href="./ranking.html">🏆 ランキングを見る</a>
  </header>

  <div class="card">
    <div class="row" style="gap:12px">
      <label>期間：
        <select id="period">
          <option value="daily">日次</option>
          <option value="weekly">週次</option>
        </select>
      </label>

      <label>ミックス：
        <select id="mix">
          <option value="allchap">全章ミックス（時代を選ぶ）</option>
          <option value="allera">時代ミックス（全時代）</option>
        </select>
      </label>

      <label id="eraWrap">時代：
        <select id="era">
          <option value="edo">江戸</option>
          <option value="muromachi">室町</option>
          <option value="kamakura">鎌倉</option>
          <option value="sengoku">戦国</option>
        </select>
      </label>

      <span class="mut">※ 全10問・正解でのみ次の問題へ。最速タイムで競います。</span>
    </div>

    <hr style="margin:14px 0;border:none;border-top:1px solid #eee">

    <div id="authState" class="mut">接続中…（匿名サインイン & App Check）</div>

    <div id="quizBox" class="quiz hidden">
      <div class="qname big" id="qTitle"></div>
      <div class="mut">〇のところだけを <b>ひらがな</b> で入力。複数はスペース/・/、/／で区切りOK。</div>
      <input id="answer" type="text" inputmode="text" autocomplete="off" placeholder="ここに ひらがな を入力（例：てんぽう）">
      <div id="feedback" class="mut"></div>
      <div class="row">
        <button id="checkBtn" class="primary">決定</button>
        <button id="nextBtn" class="hidden">次へ</button>
      </div>
      <div class="mut" id="progress"></div>
    </div>

    <div id="startBox" class="row" style="margin-top:10px">
      <button id="startBtn" class="primary">スタート</button>
      <span class="mut">サインイン完了後に開始できます。</span>
    </div>

    <div id="resultBox" class="hidden" style="margin-top:14px">
      <div id="resultText" class="big"></div>
      <div class="row" style="margin-top:10px;gap:10px">
        <input id="player" maxlength="24" placeholder="なまえ（24文字まで）">
        <button id="submit" class="primary">この設定で送信</button>
        <span class="mut">※ 同一期間・同一設定では1人1投稿のみ</span>
      </div>
    </div>

    <div id="note" class="mut warn" style="margin-top:8px"></div>
  </div>
</div>

<!-- === data === -->
<script src="./dataset.js"></script>

<!-- === Firebase SDK (compat) === -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ---------- Firebase Init (B案) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyBMcXnMxiHXg2ybI2aNrpJozN_MlDpH0lA",
  authDomain: "historykids-62240.firebaseapp.com",
  projectId: "historykids-62240",
  storageBucket: "historykids-62240.firebasestorage.app",
  messagingSenderId: "73567574639",
  appId: "1:73567574639:web:c5e91d53c479a55b708b9a",
  measurementId: "G-09Q3X0D49C"
};
firebase.initializeApp(firebaseConfig);

// App Check（必ず置き換え）
self.FIREBASE_APPCHECK_DEBUG_TOKEN = false; // ← 開発時は 'xxx' を入れてもOK
firebase.appCheck().activate('6LfoXPMrAAAAAO98VYU17M8PFwpz4pv_k2k0ngIk]', true);

// Auth（匿名）
const auth = firebase.auth();
const db   = firebase.firestore();
let authed = false;
auth.onAuthStateChanged(u=>{
  authed = !!u;
  document.getElementById('authState').textContent = authed ? '接続完了！' : '接続中…';
  document.getElementById('startBtn').disabled = !authed;
});
auth.signInAnonymously().catch(console.error);

/* ---------- helper（本体の判定ロジック準拠） ---------- */
function onlyHiraAndSep(s){ return /^[\u3041-\u3096\s・,，、/／]+$/.test(s); }
function splitTokens(ans){ let s=ans.replace(/[・,，、/／]+/g,' ').replace(/\s+/g,' ').trim();return s? s.split(' '):[]; }
function normalizeTokens(arr){ return arr.map(s=>s.replace(/\s+/g,'').trim()); }
function todayKey(){
  const d=new Date(); const y=d.getFullYear();
  const m=('0'+(d.getMonth()+1)).slice(-2); const day=('0'+d.getDate()).slice(-2);
  return `${y}-${m}-${day}`;
}
function isoWeekKey(){
  const d = new Date();
  // ISO week number
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((date - firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  const wk = ('0'+week).slice(-2);
  return `${date.getUTCFullYear()}-W${wk}`;
}

/* ---------- 問題プール作成 ---------- */
function buildPool(mode, era){
  if(!window.dataSets){ throw new Error('dataset.js が読み込めていません'); }
  const all = [];
  const eras = mode==='allera' ? ['edo','muromachi','kamakura','sengoku'] : [era];
  eras.forEach(e=>{
    const ds = dataSets[e];
    Object.values(ds.chapters).forEach(group=>{
      Object.keys(group).forEach(name=>{
        const blanks = ds.blanks[name] || [];
        // 未回答だけに限定はせず「競技用」に全件から
        all.push({ era:e, name, blanks });
      });
    });
  });
  return all;
}
function pickN(arr, n){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

/* ---------- 画面要素 ---------- */
const els = id => document.getElementById(id);
const periodSel = els('period');
const mixSel    = els('mix');
const eraWrap   = els('eraWrap');
const eraSel    = els('era');
const startBtn  = els('startBtn');
const quizBox   = els('quizBox');
const startBox  = els('startBox');
const qTitle    = els('qTitle');
const input     = els('answer');
const feedback  = els('feedback');
const checkBtn  = els('checkBtn');
const nextBtn   = els('nextBtn');
const progress  = els('progress');
const resultBox = els('resultBox');
const resultTxt = els('resultText');
const submitBtn = els('submit');

mixSel.addEventListener('change', ()=>{
  const isAllEra = mixSel.value === 'allera';
  eraWrap.style.display = isAllEra ? 'none' : '';
});

let qs=[], qi=0, tStart=0, resultMs=0;

function showQ(){
  const q = qs[qi];
  qTitle.textContent = q.name;   // 「1603 〇〇幕府がはじまる」など
  input.value = '';
  feedback.textContent = '';
  nextBtn.classList.add('hidden');
  checkBtn.disabled = false;
  input.focus();
  progress.textContent = `問題 ${qi+1} / ${qs.length}`;
}

function startGame(){
  const period = periodSel.value;    // daily / weekly
  const mode   = mixSel.value;       // allchap / allera
  const era    = eraSel.value;       // edo etc (allera時は無視)
  const pool = buildPool(mode, era);
  if(pool.length < 10){ alert('問題が足りません（dataset.jsを確認）'); return; }

  qs = pickN(pool, 10);
  qi = 0;
  startBox.classList.add('hidden');
  quizBox.classList.remove('hidden');
  resultBox.classList.add('hidden');
  showQ();
  tStart = performance.now();
}

function checkAnswer(){
  const q = qs[qi];
  const ansRaw = input.value || '';
  if(!onlyHiraAndSep(ansRaw)){
    feedback.innerHTML = '<span class="ng">ひらがなで入力してね（区切りは スペース / ・ / 、 / ／）</span>';
    return;
  }
  const user = normalizeTokens(splitTokens(ansRaw));
  const need = normalizeTokens(q.blanks);
  const ok = need.length>0 && need.every(t=>user.includes(t));
  if(ok){
    feedback.innerHTML = '<span class="ok">正解！</span>';
    checkBtn.disabled = true;
    nextBtn.classList.remove('hidden');
    if(qi === qs.length-1){
      // finish
      resultMs = Math.round(performance.now() - tStart);
      nextBtn.classList.add('hidden');
      quizBox.classList.add('hidden');
      resultBox.classList.remove('hidden');
      resultTxt.textContent = `タイム：${(resultMs/1000).toFixed(2)} 秒`;
    }
  }else{
    const a = need.join('・');
    feedback.innerHTML = `<span class="ng">ざんねん！ 正解は「${a}」</span>`;
  }
}

checkBtn.addEventListener('click', checkAnswer);
nextBtn.addEventListener('click', ()=>{ qi++; if(qi<qs.length){ showQ(); } });

startBtn.addEventListener('click', ()=>{
  if(!authed){ alert('サインイン待機中…数秒後に試してください'); return; }
  startGame();
});

/* ---------- 送信（B案のツリー & 1人1投稿） ---------- */
function periodKeyOf(kind){ return (kind==='daily') ? todayKey() : isoWeekKey(); }

submitBtn.addEventListener('click', async ()=>{
  const user = auth.currentUser;
  if(!user){ alert('サインイン状態を確認してください'); return; }
  if(!resultMs || !qs.length){ alert('まずはプレイしてね'); return; }

  const period = periodSel.value;
  const mode   = mixSel.value;
  const era    = (mode==='allera') ? 'ALL' : eraSel.value;
  const periodKey = periodKeyOf(period);
  const name = (els('player').value || '').slice(0,24) || '名無し';

  const payload = {
    app: "hk-buzzer-v1",
    uid: user.uid,
    name,
    ms: Math.round(resultMs),
    period, mode, era,
    dateKey: todayKey(),
    weekKey: isoWeekKey(),
    count: qs.length,
    ts: firebase.firestore.FieldValue.serverTimestamp()
  };

  const groupKey = `${mode}_${era}`;
  const path = `fast_scores/${period}/${periodKey}/${groupKey}/${user.uid}`;

  try{
    await db.doc(path).set(payload, { merge: false }); // 既存ならルールで弾く
    alert('送信しました！ランキングで確認できます。');
    location.href = './ranking.html';
  }catch(e){
    console.error(e);
    const m = String(e);
    if(m.includes('ALREADY_EXISTS') || m.includes('already exists')){
      alert('この期間・設定では既に投稿済みです。次の期間で挑戦してね！');
    }else{
      alert('送信に失敗しました。ネット/設定（App Check・Auth・ルール）を確認してください。');
    }
  }
});
</script>
</body>
</html>
