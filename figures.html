<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>偉人AIと話そう｜歴史キッズ</title><meta name="description" content="聖徳太子・紫式部・頼朝・信長・家康・伊能忠敬と、歴史資料を使って会話しよう。対応端末ではブラウザ内の生成AIも使えます。"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/ui/app.css?v=play-20261002"><link rel="stylesheet" href="./assets/ui/subpages.css"><link rel="stylesheet" href="./assets/ui/figures.css?v=play-20261002"><script defer src="./data/dataset.js"></script><script defer src="./data/ancient.js"></script><script defer src="./assets/ui/core.js"></script><script defer src="./assets/ui/figures.js?v=play-20261002"></script></head>
<body class="subpage"><header class="sub-header"><a class="sub-brand" href="./">歴史キッズ</a><nav aria-label="会話メニュー"><a href="./#games">学習に戻る</a><a href="./arcade.html">ゲームで遊ぶ</a></nav></header><main class="figures-main"><p class="eyebrow">MEET THE PEOPLE OF HISTORY</p><h1>もしも、偉人と話せたら。</h1><p class="figures-intro">「どうして？」「どんな時代？」を、本人になりきった相手に聞いてみよう。史実をもとにした創作の会話です。</p>
<div class="figures-layout"><aside class="figure-picker"><h2>話す人を選ぼう</h2><div id="figureList" class="figure-list" role="group" aria-label="偉人を選ぶ"></div><div class="ai-engine-panel"><h3>会話のモード</h3><p id="engineBadge" class="engine-badge">資料会話 · すぐ話せる</p><button id="enableAI" class="primary">生成AIを起動する</button><p class="small muted">AIモデルを初回に約500MBダウンロードします。十分な空き容量のあるPCでの利用がおすすめです。会話は端末内で処理します。AIが使えない端末でも資料会話で遊べます。</p><p id="engineStatus" class="small" role="status"></p><progress id="engineProgress" max="1" value="0" aria-label="AIの読み込み" hidden></progress><button id="useGuide" hidden>資料会話に切り替える</button></div></aside>
<section class="conversation" aria-label="偉人との会話"><header class="conversation-head"><span id="figureAvatar" class="figure-avatar" aria-hidden="true"></span><div><p id="figureEra" class="eyebrow"></p><h2 id="figureName"></h2><p id="figureTag"></p></div><button id="resetChat" class="text-button">会話を新しくする</button></header><div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="会話の履歴"></div><div id="suggestions" class="suggestions" role="group" aria-label="質問の例"></div><form id="chatForm" class="chat-form"><label for="chatInput">聞きたいこと</label><div class="input-row"><textarea id="chatInput" rows="2" maxlength="500" placeholder="例：どんなことを大切にしていたの？" required></textarea><button id="sendChat" class="primary">送信 →</button><button id="stopChat" hidden type="button">止める</button></div><small class="muted">Enterで送信・Shift＋Enterで改行。AIの答えは資料リンクでも確かめてね。</small></form><p id="chatStatus" class="chat-status" role="status"></p></section></div></main></body></html>
