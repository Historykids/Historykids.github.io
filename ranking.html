<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>早押しランキング｜歴史キッズ</title>
    <meta name="theme-color" content="#172f45" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/ui/app.css" />
    <link rel="stylesheet" href="./assets/ui/subpages.css" />
    <script defer src="./assets/ui/core.js"></script>
    <script defer src="./assets/ui/cloud.js"></script>
    <script defer src="./assets/ui/ranking.js"></script>
  </head>
  <body class="subpage">
    <header class="sub-header">
      <a href="./" class="sub-brand">歴史キッズ</a>
      <nav aria-label="ゲームメニュー">
        <a href="./#games">学習に戻る</a
        ><a href="./buzzer.html">早押しに挑戦</a>
      </nav>
    </header>
    <main class="sub-main">
      <p class="eyebrow">HISTORY LEADERBOARD</p>
      <h1>早押しランキング</h1>
      <p class="muted sub-intro">
        新・早押し決戦は10問全問正解のタイムで競います。4択・入力・従来の記録は別々に表示します。
      </p>
      <section class="rank-panel" aria-label="ランキングの条件">
        <div class="filters">
          <label>ルール<select id="edition"><option value="v3">新・早押し決戦</option><option value="v2">従来の早押し</option></select></label>
          <label id="answerModeWrap">答え方<select id="answerMode"><option value="choice">難しい4択</option><option value="type">ひらがな入力</option></select></label>
          <label
            >期間<select id="period">
              <option value="daily">きょう</option>
              <option value="weekly">今週</option>
            </select></label
          ><label
            >範囲<select id="mode">
              <option value="allchap">時代を選ぶ</option>
              <option value="allera">全時代ミックス</option>
            </select></label
          ><label id="eraWrap"
            >時代<select id="era">
              <option value="edo">江戸時代</option>
              <option value="kamakura">鎌倉時代</option>
              <option value="muromachi">室町時代</option>
              <option value="sengoku">戦国時代</option>
            </select></label
          >
        </div>
        <button id="reload" class="primary">記録を更新</button
        ><span id="key" class="muted small"></span>
      </section>
      <section class="rank-panel">
        <span class="section-label">このブラウザの自己ベスト</span>
        <p id="personal" class="rank-summary"></p>
      </section>
      <section class="rank-panel">
        <div class="section-heading">
          <h2>みんなの記録 TOP100</h2>
          <a class="link-pill" href="./buzzer.html">早押しに挑戦</a>
        </div>
        <div class="ranking-table">
          <table>
            <thead>
              <tr>
                <th scope="col">順位</th>
                <th scope="col">ニックネーム</th>
                <th scope="col">タイム</th>
                <th scope="col">記録日時</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr>
                <td colspan="4" class="empty-cell">読み込み中…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p id="rankStatus" role="status" class="muted small"></p>
      </section>
    </main>
  </body>
</html>
