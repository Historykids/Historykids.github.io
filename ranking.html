<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>歴史キッズ｜早押しランキング</title>
  <style>
    :root{--ink:#1f2937;--mut:#64748b;--card:#fff}
    body{margin:0;background:linear-gradient(180deg,#fffdf4,#fff7ec);color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",YuGothic,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
    .wrap{max-width:920px;margin:24px auto;padding:0 14px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    header h1{font-size:18px;margin:0}
    .card{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:16px;box-shadow:0 10px 24px rgba(15,23,42,.08)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    select,button{appearance:none;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:10px 12px;font-weight:700}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
    th{background:#fff8e1}
    .mut{color:#64748b}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;background:#fff}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏆 ランキング</h1>
    <a class="pill" href="./buzzer.html">⏱ 早押しへ戻る</a>
  </header>

  <div class="card">
    <div class="row">
      <label>期間：
        <select id="period">
          <option value="daily">日次（今日）</option>
          <option value="weekly">週次（今週）</option>
        </select>
      </label>
      <label>ミックス：
        <select id="mode">
          <option value="allchap">全章ミックス</option>
          <option value="allera">時代ミックス</option>
        </select>
      </label>
      <label id="eraWrap">時代：
        <select id="era">
          <option value="ALL">全時代</option>
          <option value="edo">江戸</option>
          <option value="muromachi">室町</option>
          <option value="kamakura">鎌倉</option>
          <option value="sengoku">戦国</option>
        </select>
      </label>
      <button id="reload">更新</button>
      <span id="meta" class="mut"></span>
    </div>

    <table>
      <thead>
        <tr><th>#</th><th>名前</th><th>タイム</th><th>問題数</th><th>投稿</th></tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="5" class="mut">読み込み中…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMcXnMxiHXg2ybI2aNrpJozN_MlDpH0lA",
  authDomain: "historykids-62240.firebaseapp.com",
  projectId: "historykids-62240",
  storageBucket: "historykids-62240.firebasestorage.app",
  messagingSenderId: "73567574639",
  appId: "1:73567574639:web:c5e91d53c479a55b708b9a",
  measurementId: "G-09Q3X0D49C"
};
firebase.initializeApp(firebaseConfig);

// App Check（読み取り側も通す）
firebase.appCheck().activate('reCAPTCHA_V3_SITE_KEY_HERE', true);

const db = firebase.firestore();
const el = id => document.getElementById(id);
const periodSel = el('period');
const modeSel   = el('mode');
const eraSel    = el('era');
const eraWrap   = el('eraWrap');
const meta      = el('meta');
const tbody     = el('tbody');

function todayKey(){
  const d=new Date(); const y=d.getFullYear();
  const m=('0'+(d.getMonth()+1)).slice(-2); const day=('0'+d.getDate()).slice(-2);
  return `${y}-${m}-${day}`;
}
function isoWeekKey(){
  const d = new Date();
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((date - firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  const wk = ('0'+week).slice(-2);
  return `${date.getUTCFullYear()}-W${wk}`;
}
function periodKeyOf(kind){ return (kind==='daily') ? todayKey() : isoWeekKey(); }

function updateEraUi(){
  const isAllEra = modeSel.value === 'allera';
  eraWrap.style.display = isAllEra ? 'none' : '';
  if(isAllEra){ eraSel.value = 'ALL'; }
}
modeSel.addEventListener('change', updateEraUi);
updateEraUi();

async function load(){
  const period = periodSel.value;
  const periodKey = periodKeyOf(period);
  const mode = modeSel.value;
  const era  = (mode==='allera') ? 'ALL' : eraSel.value;
  const groupKey = `${mode}_${era}`;

  meta.textContent = `表示: ${period} / ${groupKey} / キー=${periodKey}`;
  tbody.innerHTML = `<tr><td colspan="5" class="mut">読み込み中…</td></tr>`;

  try{
    const snap = await db.collection(`fast_scores/${period}/${periodKey}/${groupKey}`)
                         .orderBy('ms','asc').limit(50).get();
    if(snap.empty){
      tbody.innerHTML = `<tr><td colspan="5" class="mut">まだ投稿がありません</td></tr>`;
      return;
    }
    const rows = [];
    let rank = 1;
    snap.forEach(doc=>{
      const d = doc.data();
      const ms = d.ms || 0;
      const sec = (ms/1000).toFixed(2)+' 秒';
      const when = d.ts && d.ts.toDate ? d.ts.toDate().toLocaleString() : '-';
      rows.push(`<tr>
        <td>${rank++}</td>
        <td>${(d.name||'名無し').replace(/[<>&]/g,'')}</td>
        <td>${sec}</td>
        <td>${d.count||'-'}</td>
        <td class="mut">${when}</td>
      </tr>`);
    });
    tbody.innerHTML = rows.join('');
  }catch(e){
    console.error(e);
    tbody.innerHTML = `<tr><td colspan="5" class="mut">読み込みに失敗しました（App Check/ルール/キーを確認）</td></tr>`;
  }
}
el('reload').addEventListener('click', load);
periodSel.addEventListener('change', load);
modeSel.addEventListener('change', load);
eraSel.addEventListener('change', load);

// 初回
load();
</script>
</body>
</html>
