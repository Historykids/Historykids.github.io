name = "historykids-ranking-api"
main = "worker.mjs"
compatibility_date = "2026-10-02"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "HistoryLeaderboard"

[[migrations]]
tag = "ranking-v1"
new_sqlite_classes = ["HistoryLeaderboard"]

