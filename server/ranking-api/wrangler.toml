name = "historykids-ranking-api"
main = "worker.mjs"
compatibility_date = "2026-10-02"
workers_dev = true

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "HistoryLeaderboard"

[[migrations]]
tag = "ranking-v1"
new_sqlite_classes = ["HistoryLeaderboard"]

[[ratelimits]]
name = "RANK_READ_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RANK_WRITE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RANK_GLOBAL_LIMITER"
namespace_id = "1005"
[ratelimits.simple]
limit = 600
period = 60
