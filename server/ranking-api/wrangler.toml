name = "historykids-ranking-api"
main = "worker.mjs"
compatibility_date = "2026-10-02"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "HistoryLeaderboard"

[[migrations]]
tag = "ranking-v1"
new_sqlite_classes = ["HistoryLeaderboard"]

[[ratelimits]]
name = "RANK_READ_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RANK_WRITE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RANK_GLOBAL_LIMITER"
namespace_id = "1005"
[ratelimits.simple]
limit = 600
period = 60

[[ratelimits]]
name = "ADMIN_CLAIM_LIMITER"
namespace_id = "1006"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "POKER_ROOM_LIMITER"
namespace_id = "1007"
[ratelimits.simple]
limit = 3000
period = 60

[[ratelimits]]
name = "ACCOUNT_AUTH_LIMITER"
namespace_id = "1008"
[ratelimits.simple]
limit = 30
period = 60


[[ratelimits]]
name = "SENGOKU_ACTIVITY_LIMITER"
namespace_id = "1009"
[ratelimits.simple]
limit = 3000
period = 60

# A separate arena keeps real-time simulation isolated from saved game accounts.
[[durable_objects.bindings]]
name = "SNAKE_ARENA"
class_name = "NeonSnakeArena"

[[migrations]]
tag = "neon-snake-v1"
new_sqlite_classes = ["NeonSnakeArena"]

[[ratelimits]]
name = "SNAKE_CONNECT_LIMITER"
namespace_id = "1010"
[ratelimits.simple]
limit = 240
period = 60

[[durable_objects.bindings]]
name = "RACING_ROOM"
class_name = "TougeRaceRoom"

[[migrations]]
tag = "touge-race-v1"
new_sqlite_classes = ["TougeRaceRoom"]

[[ratelimits]]
name = "RACING_CONNECT_LIMITER"
namespace_id = "1011"
[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "RACING_HUB"
class_name = "TougeRaceHub"

[[migrations]]
tag = "touge-race-hub-v1"
new_sqlite_classes = ["TougeRaceHub"]
