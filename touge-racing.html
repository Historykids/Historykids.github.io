<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="歴史キッズの3Dレーシングゲーム。世界を舞台にした10コースで、オンライン対戦・CPU対戦・タイムアタック。">
  <title>峠レーシング 3D｜歴史キッズ</title>
  <link rel="canonical" href="https://historykids.github.io/touge-racing.html">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./assets/ui/touge-racing.css?v=6.2">
  <script type="module" src="./assets/ui/touge-racing-home.js?v=6"></script>
</head>
<body>
  <header class="topbar"><a class="back" href="./#games">← ゲームで遊ぶ</a><button type="button" id="change-name" class="profile-link" hidden>名前を変更</button></header>
  <main class="race-portal">
    <section class="portal-hero" aria-labelledby="portal-title">
      <canvas id="portal-course" aria-hidden="true"></canvas>
      <div class="portal-copy">
        <p class="course"><span class="checker" aria-hidden="true"></span> 歴史キッズ</p>
        <h1 id="portal-title">峠レーシング <em>3D</em></h1>
        <p>世界を舞台にした10コースを走ろう。</p>
      </div>
    </section>
    <nav class="portal-modes" aria-label="レースモード">
      <a href="./touge-racing-rooms.html" class="portal-card portal-online"><strong>オンライン対戦</strong><span>部屋一覧から参加 · 2人以上でスタート</span><b aria-hidden="true">↗</b></a>
      <a href="./touge-racing-play.html?mode=cpu" class="portal-card"><strong>CPU対戦</strong><span>アイテムを使って3周勝負</span><b aria-hidden="true">↗</b></a>
      <a href="./touge-racing-play.html?mode=trial" class="portal-card"><strong>タイムアタック</strong><span>1人で1周の自己ベストに挑戦</span><b aria-hidden="true">↗</b></a>
      <a href="./touge-racing-ranking.html" class="portal-card"><strong>ランキング</strong><span>コース別のタイムアタック記録</span><b aria-hidden="true">↗</b></a>
      <a href="./touge-racing-tutorial.html" class="portal-card portal-tutorial"><strong>チュートリアル</strong><span>基本操作・ドリフト・アイテム</span><b aria-hidden="true">↗</b></a>
    </nav>
    <dialog id="name-dialog" class="name-dialog" aria-labelledby="name-title">
      <form id="name-form">
        <h2 id="name-title">レーサー名を決めよう</h2>
        <p>この名前が対戦ルームとランキングに表示されるよ。</p>
        <label for="racer-name">レーサー名</label>
        <input id="racer-name" type="text" required maxlength="14" autocomplete="nickname" placeholder="名前を入力" autofocus>
        <p id="name-error" role="status"></p>
        <button class="primary" type="submit">この名前で始める →</button>
      </form>
    </dialog>
  </main>
</body>
</html>
