<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101c27">
    <meta name="description" content="歴史キッズの無料3Dレーシングゲーム。海沿いの夕凪峠をCPU3台と3周勝負。パソコン・スマホ対応。">
    <title>峠レーシング 3D｜歴史キッズ</title>
    <link rel="canonical" href="https://historykids.github.io/touge-racing.html">
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./assets/ui/touge-racing.css">
    <script type="module" src="./assets/ui/touge-racing.js?v=2"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="back" href="./#games"><span aria-hidden="true">←</span> ゲームで遊ぶ</a>
      <span class="brand">歴史キッズ</span>
    </header>
    <main class="game" id="game" data-state="loading">
      <canvas id="track" aria-label="夕凪峠の3Dコース"></canvas>
      <section class="intro" id="intro" aria-labelledby="game-title">
        <div class="intro-copy">
          <p class="course"><span class="checker" aria-hidden="true"></span> 夕凪峠</p>
          <h1 id="game-title">峠レーシング <em>3D</em></h1>
          <p class="brief">CPU3台と3周勝負。青いブーストを踏んで加速し、カーブの手前でブレーキ。</p>
          <button class="primary" id="start" type="button" disabled>レース開始 <span aria-hidden="true">→</span></button>
          <p class="keyboard">矢印キー / WASDで操作</p>
          <p class="touch-hint">画面のボタンを押し続けて操作</p>
          <p class="error" id="error" role="status"></p>
        </div>
      </section>
      <aside class="map-panel" aria-label="コースマップ">
        <canvas id="map" width="164" height="106"></canvas>
        <span>夕凪峠</span>
      </aside>
      <div class="hud" id="hud" hidden>
        <div class="race-stats">
          <div class="stat"><span>順位</span><strong id="place">4<small> / 4</small></strong></div>
          <div class="stat"><span>周回</span><strong id="lap">1<small> / 3</small></strong></div>
          <div class="stat"><span>タイム</span><strong id="time">0:00.00</strong></div>
        </div>
        <button class="pause" id="pause" type="button" aria-label="一時停止">Ⅱ</button>
        <div class="speedometer">
          <div><strong id="speed">0</strong> <span>km/h</span></div>
          <progress id="speed-bar" max="230" value="0" aria-label="スピード"></progress>
          <span id="boost" class="boost" hidden>ブースト</span>
        </div>
        <div class="countdown" id="countdown" role="status" hidden></div>
        <div class="touch-controls" aria-label="タッチ操作">
          <div class="control-group">
            <button type="button" data-input="left" aria-label="左に曲がる">‹</button>
            <button type="button" data-input="right" aria-label="右に曲がる">›</button>
          </div>
          <div class="control-group">
            <button type="button" data-input="brake">ブレーキ</button>
            <button type="button" data-input="gas">アクセル</button>
          </div>
        </div>
      </div>
      <section class="overlay" id="paused" aria-labelledby="pause-title" hidden>
        <div class="dialog">
          <h2 id="pause-title">一時停止</h2>
          <button class="primary" id="resume" type="button">レースに戻る</button>
          <button class="secondary" id="restart" type="button">最初からやり直す</button>
        </div>
      </section>
      <section class="overlay" id="result" aria-labelledby="result-title" hidden>
        <div class="dialog">
          <h2 id="result-title">レース終了</h2>
          <p class="result-place"><strong id="result-place"></strong> 位 / 4台</p>
          <dl class="result-stats">
            <div><dt>タイム</dt><dd id="result-time"></dd></div>
            <div><dt>自己ベスト</dt><dd id="best-time"></dd></div>
          </dl>
          <p class="record" id="record" role="status" hidden>自己ベスト更新！</p>
          <button class="primary" id="retry" type="button">もう一度走る</button>
          <a class="secondary" href="./#games">ゲーム一覧に戻る</a>
        </div>
      </section>
      <noscript><p class="noscript">遊ぶには、ブラウザでJavaScriptを有効にしてね。</p></noscript>
    </main>
  </body>
</html>
